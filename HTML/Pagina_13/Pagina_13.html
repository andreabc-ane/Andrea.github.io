
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El reloj de Cenicienta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <p class="eyebrow">UN INSTANTE MÁGICO</p>
    <h1>El reloj de Cenicienta</h1>
    <p class="subtitle">Cada segundo puede convertirse en magia ✦</p>

    <section class="clock-wrap">
      <div class="clock">
        <div class="ornament">✧</div>
        <div class="tickmarks" id="tickmarks"></div>
        <div class="numbers">
          <span class="n n12">12</span><span class="n n1">1</span>
          <span class="n n2">2</span><span class="n n3">3</span>
          <span class="n n4">4</span><span class="n n5">5</span>
          <span class="n n6">6</span><span class="n n7">7</span>
          <span class="n n8">8</span><span class="n n9">9</span>
          <span class="n n10">10</span><span class="n n11">11</span>
        </div>
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand"></div>
        <div class="pin"></div>
        <div class="clock-label">★ MAGIC TIME ★</div>
      </div>
    </section>

    <div class="time-display" id="digitalTime">00:00:00</div>
    <p class="note">Un reloj de cuento con manecillas aceleradas.</p>
    <div class="legend">
      <span><i class="dot hour"></i> Horas</span>
      <span><i class="dot minute"></i> Minutos</span>
      <span><i class="dot second"></i> Segundos</span>
    </div>
    <footer>Diseño inspirado en los cuentos de hadas · Página 12</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
