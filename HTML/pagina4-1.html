<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <title>Pagina 4 - Flor</title>

  <style>
      canvas{
          border: 3px solid #8fbc8f;
          background-color: rgb(47, 63, 52);
      }
  </style>

<script>
    
    function DibujarFlor(){
        var canvas = document.getElementById("micanvas");
        var context = canvas.getContext("2d");

        // Fondo
        context.fillStyle = "white"; 
        context.fillRect(0, 0, 800, 600);

        // Tallo 
        context.fillStyle = "green";
        context.fillRect(390, 300, 20, 180);
        context.fillRect(370, 350, 20, 20);
        context.fillRect(410, 390, 20, 20);

        // Hojas 
        context.fillStyle = "green";
        context.fillRect(330, 380, 60, 20); 
        context.fillRect(330, 400, 40, 20);

        context.fillRect(410, 420, 60, 20); 
        context.fillRect(430, 400, 40, 20);

        // Pétalo de arriba 
        context.fillStyle = "pink";
        context.fillRect(370, 180, 60, 60); 
        context.fillRect(350, 220, 100, 60);

        // Pétalo izquierdo 
        context.fillRect(290, 250, 80, 60); 
        context.fillRect(310, 230, 60, 100);

        // Pétalo derecho 
        context.fillRect(430, 250, 80, 60); 
        context.fillRect(430, 230, 60, 100);

        // Pétalo de abajo 
        context.fillRect(370, 300, 60, 60); 
        context.fillRect(350, 280, 100, 60);

        // Centro de la flor 
        context.fillStyle = "yellow"; 
        context.fillRect(370, 250, 60, 60);
        context.fillRect(350, 270, 100, 20); 
        context.fillRect(390, 230, 20, 100);

    }

    // Dibujar la flor cuando se carga la página
    window.onload = DibujarFlor;

</script>

  </head>
<body>

    <h1>Flor hecha con cuadrados y rectángulos</h1>
   <canvas id="micanvas" width="800" height="600"></canvas>

</body>
</html>
